<!-- Descrição: Página de login do sistema de acompanhamento de demandas -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrar — Sistema de Acompanhamento de Demandas</title>

<link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

<!-- Container principal que organiza as áreas da tela de login -->
<div class="shell">

  <!-- Coluna de identidade do sistema -->
  <section class="brand">
    <div class="brand-top">

      <div class="logo-row">
        <div class="logo-mark">SD</div>
        <div class="logo-text">Sistema de Acompanhamento de Demandas</div>
      </div>

    </div>
  </section>

  <!-- Coluna de autenticação do usuário -->
  <section class="auth">
    <div class="auth-card">

      <h2 class="auth-title" id="authTitle">Entrar</h2>

      <!-- Formulário responsável pelo envio das credenciais do usuário -->
      <form id="loginForm">

        <!-- Campo utilizado para identificação através do e-mail institucional -->
        <div class="field" id="emailField">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="nome@puccampinas.edu.br"
            autocomplete="username"
            required
          >
        </div>

        <!-- Campo utilizado para informar a senha de acesso ao sistema -->
        <div class="field" id="passwordField">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="********"
            autocomplete="current-password"
            required
            minlength="6"
            maxlength="30"
          >
        </div>

        <!-- Opção para manter a sessão do usuário ativa após o login -->
        <div class="row-between">
          <label class="remember">
            <input type="checkbox" name="remember">
            Manter conectado
          </label>
        </div>

        <!-- Botão responsável pelo envio do formulário de login -->
        <button type="submit" class="primary" id="submitBtn">Entrar</button>
      </form>

      <!-- Formulário de criação de conta. Fica escondido até o usuário
           clicar em "Criar conta"; todo usuário criado aqui entra como
           Membro da Equipe, sem projeto vinculado. -->
      <form id="cadastroForm" class="hidden">

        <div class="field" id="nomeField">
          <label for="nome">Nome completo</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Seu nome completo"
            autocomplete="name"
            required
          >
        </div>

        <div class="field" id="emailCadastroField">
          <label for="emailCadastro">E-mail</label>
          <input
            type="email"
            id="emailCadastro"
            name="email"
            placeholder="nome@puccampinas.edu.br"
            autocomplete="username"
            required
          >
        </div>

        <div class="field" id="senhaCadastroField">
          <label for="senhaCadastro">Senha</label>
          <input
            type="password"
            id="senhaCadastro"
            name="senha"
            placeholder="********"
            autocomplete="new-password"
            required
            minlength="6"
            maxlength="30"
          >
        </div>

        <div class="field" id="confirmarSenhaField">
          <label for="confirmarSenha">Confirmar senha</label>
          <input
            type="password"
            id="confirmarSenha"
            name="confirmarSenha"
            placeholder="********"
            autocomplete="new-password"
            required
            minlength="6"
            maxlength="30"
          >
        </div>

        <button type="submit" class="primary" id="cadastrarBtn">Criar conta</button>
      </form>

      <!-- Alterna entre o formulário de login e o de criação de conta -->
      <p class="switch-auth" id="switchParaCadastro">
        Não tem conta? <a href="#" id="toggleCadastro">Criar conta</a>
      </p>
      <p class="switch-auth hidden" id="switchParaLogin">
        Já tem conta? <a href="#" id="toggleLogin">Entrar</a>
      </p>

    </div>
  </section>

</div>

<script src="../JS/api.js"></script>
<script src="../JS/login.js"></script>


</body>
</html>
