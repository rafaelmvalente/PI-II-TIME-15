<!-- Descrição: Tela de listagem de demandas, com filtros, busca e ordenação -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demandas — Sistema de Acompanhamento de Demandas</title>
  <link rel="stylesheet" href="listagem-demandas.css">
</head>
<body>

  <div class="page-demandas">

    <header class="demandas-header">
      <h1>Sistema de Acompanhamento de Demandas</h1>
      <h2>Demandas</h2>
    </header>

    <!-- Barra de filtros, busca e ordenação das demandas -->
    <section class="barra-filtros">

      <!-- Campo de busca textual (título ou descrição) -->
      <input
        type="text"
        class="campo-busca"
        placeholder="Buscar por título ou descrição..."
      >

      <!-- Filtro por status -->
      <select class="filtro">
        <option value="">Status</option>
        <option value="aberta">Aberta</option>
        <option value="em_andamento">Em andamento</option>
        <option value="em_revisao">Em revisão</option>
        <option value="concluida">Concluída</option>
        <option value="cancelada">Cancelada</option>
      </select>

      <!-- Filtro por prioridade -->
      <select class="filtro">
        <option value="">Prioridade</option>
        <option value="critica">Crítica</option>
        <option value="alta">Alta</option>
        <option value="media">Média</option>
        <option value="baixa">Baixa</option>
      </select>

      <!-- Filtro por tipo -->
      <select class="filtro">
        <option value="">Tipo</option>
        <option value="tarefa">Tarefa</option>
        <option value="defeito">Defeito</option>
        <option value="melhoria">Melhoria</option>
        <option value="documentacao">Documentação</option>
      </select>

      <!-- Filtro por responsável -->
      <select class="filtro">
        <option value="">Responsável</option>
        <option value=></option>
        <option value=></option>
        <option value=></option>
      </select>

      <!-- Filtro por projeto -->
      <select class="filtro">
        <option value="">Projeto</option>
        <option value="projeto1">Projeto A</option>
        <option value="projeto2">Projeto B</option>
      </select>

      <!-- Ordenação dos resultados -->
      <select class="filtro">
        <option value="">Ordenar por</option>
        <option value="prioridade">Prioridade</option>
        <option value="data_criacao">Data de criação</option>
        <option value="prazo">Prazo de finalização</option>
        <option value="status">Status</option>
      </select>

    </section>

    <!-- 
         Exibe, título, tipo, prioridade, status,
         projeto, responsável, data de criação e prazo de
         finalização.
          -->
    <section class="tabela-demandas">
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Tipo</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Projeto</th>
            <th>Responsável</th>
            <th>Criada em</th>
            <th>Prazo</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </section>

  </div>

</body>
</html>
