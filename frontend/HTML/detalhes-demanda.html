<!-- Descrição: Tela de detalhes de uma demanda, com informações completas, histórico de alterações e comentários -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes da Demanda — Sistema de Acompanhamento de Demandas</title>
  <link rel="stylesheet" href="../CSS/menu.css">
  <link rel="stylesheet" href="../CSS/detalhes-demanda.css">
</head>
<body>

  <div class="page-detalhes">

    <header class="detalhes-header">
      <h1>Sistema de Acompanhamento de Demandas</h1>
      <h2>Detalhes da Demanda</h2>
    </header>

    <!-- Informações principais da demanda -->
    <section class="cartao-demanda">

      <div class="topo-demanda">
        <div>
          <span class="codigo-demanda" id="codigoDemanda">#0000</span>
          <h3 class="titulo-demanda" id="tituloDemanda">Carregando...</h3>
        </div>

        <div class="tags-demanda">
          <span class="tag tag-tipo" id="tagTipo"></span>
          <span class="tag" id="tagPrioridade"></span>
          <span class="tag" id="tagStatus"></span>
        </div>
      </div>

      <p class="descricao-demanda" id="descricaoDemanda"></p>

      <!-- Informações complementares da demanda -->
      <div class="grade-info">
        <div class="info-item">
          <span class="rotulo">Projeto</span>
          <span class="valor" id="valorProjeto"></span>
        </div>
        <div class="info-item">
          <span class="rotulo">Responsável</span>
          <span class="valor" id="valorResponsavel"></span>
        </div>
        <div class="info-item">
          <span class="rotulo">Criada em</span>
          <span class="valor" id="valorCriadaEm"></span>
        </div>
        <div class="info-item">
          <span class="rotulo">Última atualização</span>
          <span class="valor" id="valorAtualizadaEm"></span>
        </div>
        <div class="info-item">
          <span class="rotulo">Prazo de finalização</span>
          <span class="valor" id="valorPrazo"></span>
        </div>
      </div>

      <p class="mensagem-api" id="mensagemApi"></p>

      <!-- Ações disponíveis, de acordo com o perfil do usuário logado -->
      <div class="acoes-demanda">
        <button class="secundario" id="btnEditar">Editar</button>
        <button class="secundario" id="btnAlterarStatus">Alterar status</button>
        <button class="perigo" id="btnCancelar">Cancelar demanda</button>
      </div>

    </section>

    <!-- Histórico de alterações da demanda. Não é apagado nem após o cancelamento -->
    <section class="cartao-secao">
      <h3>Histórico de alterações</h3>
      <ul class="lista-historico" id="listaHistorico"></ul>
    </section>

    <!-- Comentários registrados na demanda -->
    <section class="cartao-secao">
      <h3>Comentários</h3>

      <ul class="lista-comentarios" id="listaComentarios"></ul>

      <!-- Formulário para registro de um novo comentário -->
      <form class="novo-comentario" id="formComentario">
        <textarea id="textoComentario" placeholder="Escreva um comentário..." rows="3"></textarea>
        <button type="submit" class="primario">Comentar</button>
      </form>

    </section>

  </div>

  <script src="../JS/api.js"></script>
  <script src="../JS/menu.js"></script>
  <script src="../JS/detalhes-demanda.js"></script>
</body>
</html>
